[build]
  command = "node build.js"
  publish = "."

# контент.json меняется из админки — браузер всегда должен спрашивать свежую версию
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
